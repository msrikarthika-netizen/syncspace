version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncspace_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: syncspace_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis:7-alpine
    container_name: syncspace_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: syncspace_backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/syncspace_dev
      DEV_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/syncspace_dev
      PROD_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/syncspace_prod
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      FRONTEND_URL: http://localhost:5173
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-syncspace_internal_webhook_secret_change_this}
    volumes:
      - ./backend:/app
      - /app/node_modules

  ai:
    build: ./ai
    container_name: syncspace_ai
    restart: unless-stopped
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - redis
    env_file: ./ai/.env
    environment:
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://backend:3000
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-syncspace_internal_webhook_secret_change_this}
    volumes:
      - ./ai:/app

  frontend:
    build: ./frontend
    container_name: syncspace_frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_SOCKET_URL: http://localhost:3000
      VITE_AI_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
